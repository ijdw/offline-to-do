<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="offlinetodo.png">
  <title>Offline To-Do</title>
  <style>
    :root {
      --font-serif: Garamond, Georgia, "Times New Roman", serif;
      --font-sans: 'Century Gothic', CenturyGothic, AppleGothic, 'Tw Cen MT', sans-serif;
      --radius: 4px; 
      --danger: #b42318;
      --success: #2e7d32;
      --warning: #8a5a00;
      
      --sidebar-bg: hsl(217, 20%, 90%);
      --sidebar-text: hsl(217, 20%, 15%);
      --border: rgba(0,0,0,0.08);
      --canvas-bg: hsl(217, 10%, 98%);
      --text-main: #1a202c;
      --muted: #a0aec0;
    }

    * { box-sizing: border-box; }

    body, input, textarea, select, button {
      font-family: var(--font-sans);
    }

    body {
      margin: 0;
      font-size: 14px;
      color: var(--text-main);
      background: var(--canvas-bg);
      height: 100vh;
      display: flex;
      flex-direction: row;
      overflow: hidden;
      transition: background 0.3s, color 0.3s;
    }

    .sidebar h1, .kanban-header h3, .modal-header h2 {
      font-family: var(--font-serif);
      font-weight: normal;
      margin: 0;
    }

    button { cursor: pointer; }
    .view-toggle button, .action-icon, .icon-btn, .pin-btn, .collapse-btn, .shift-btn, .menu-list button, .action-btn, .editable-label button {
      background: transparent;
      border: none;
      padding: 0;
      color: inherit;
    }

    .sidebar {
      width: 340px; 
      background: var(--sidebar-bg);
      color: var(--sidebar-text);
      display: flex;
      flex-direction: column;
      height: 100%;
      flex-shrink: 0;
      border-right: 1px solid var(--border);
    }

    .canvas {
      flex: 1;
      display: flex;
      flex-direction: column;
      height: 100%;
      background: var(--canvas-bg);
      position: relative;
      min-width: 0;
    }

    .sidebar-fixed { padding: 32px 32px 16px 32px; }
    
    .header-row {
      display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;
    }
    .sidebar h1 { font-size: 22px; color: var(--sidebar-text); margin: 0; }

    .filter-group { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
    .filter-icon { opacity: 0.6; display: flex; align-items: center; justify-content: center; width: 16px; height: 16px; }
    .filter-group select {
      appearance: none; background: transparent; border: none;
      color: var(--sidebar-text); outline: none; padding: 0;
      opacity: 0.7; transition: opacity 0.2s; cursor: pointer;
      font-size: 13px;
    }
    .filter-group select:hover { opacity: 1; font-weight: bold; }
    body.dark-mode .filter-group select option { background: #333; color: #fff; }

    .view-toggle { margin: 28px 0 16px 0; font-size: 11px; font-weight: bold; letter-spacing: 1px; color: var(--sidebar-text); opacity: 0.8; }
    .view-toggle button { font-weight: inherit; opacity: 0.5; }
    .view-toggle button.active, .view-toggle button:hover { opacity: 1; }

    .sidebar-scroll { flex: 1; overflow-y: auto; padding: 0 32px 32px 32px; }
    
    /* COMPACT 3-LINE TASK CARD */
    .task-card {
      display: flex;
      flex-direction: column;
      padding: 6px 0; /* Tight padding to keep the whole card compact */
      border-bottom: 1px solid transparent;
    }
    .task-card:hover { border-bottom-color: var(--border); }

    /* Line 1: Actions */
    .task-actions {
      display: flex; justify-content: flex-end; gap: 4px;
      min-height: 18px; /* Reserves space so card doesn't jump on hover */
      opacity: 0; transition: opacity 0.2s;
      margin-bottom: 2px;
    }
    .task-card:hover .task-actions,
    .task-card:focus-within .task-actions { opacity: 1; }
    .action-icon { padding: 2px; color: var(--sidebar-text); opacity: 0.5; }
    .action-icon:hover { opacity: 1; }
    .action-icon.delete-icon:hover { color: var(--danger); opacity: 1; }
    .action-icon svg { width: 14px; height: 14px; stroke-width: 1.5; }

    /* Line 2: Checkbox + Title */
    .task-main-row {
      display: flex; align-items: flex-start; gap: 8px;
    }
    .task-check { margin-top: 1px; width: 12px; height: 12px; accent-color: var(--sidebar-text); cursor: pointer; flex-shrink: 0; }
    .task-title { font-weight: bold; font-size: 14px; line-height: 1.3; cursor: pointer; }
    .task-card.completed .task-title { opacity: 0.5; text-decoration: line-through; }

    /* Line 3: Tags */
    .task-meta-line { 
      font-style: italic; font-size: 11px; display: flex; flex-wrap: wrap; gap: 6px; letter-spacing: 0.2px;
      margin-top: 4px; padding-left: 20px; /* Pushes tags past the checkbox to align with text */
    }

    @media (max-width: 900px) {
      .task-actions { opacity: 1; }
      .sidebar { width: 300px; }
      .sidebar-fixed, .sidebar-scroll { padding-left: 24px; padding-right: 24px; }
    }

    .sidebar-collapse-btn {
      width: 24px; height: 24px;
      display: flex; align-items: center; justify-content: center;
      background: transparent; border: none; padding: 0;
      color: var(--sidebar-text); opacity: 0.6; border-radius: var(--radius);
      transition: opacity 0.2s, background 0.2s;
      font-size: 20px; line-height: 1; cursor: pointer;
    }
    .sidebar-collapse-btn:hover { opacity: 1; background: rgba(0,0,0,0.05); }

    .sidebar-reopen {
      position: absolute; top: 14px; left: 10px;
      width: 24px; height: 24px;
      display: none; align-items: center; justify-content: center;
      background: transparent; border: none; padding: 0;
      color: var(--sidebar-text); opacity: 0.6; border-radius: var(--radius);
      transition: opacity 0.2s, background 0.2s;
      font-size: 20px; line-height: 1; z-index: 2; cursor: pointer;
    }
    .sidebar-reopen:hover { opacity: 1; background: rgba(0,0,0,0.05); }

    .body-sidebar-collapsed .sidebar {
      width: 44px; border-right: 1px solid var(--border); position: relative;
    }
    .body-sidebar-collapsed .sidebar > * { display: none; }
    .body-sidebar-collapsed .sidebar-reopen { display: flex; }
    .body-sidebar-collapsed .canvas { flex: 1; }

    .last-backup-notice {
      position: fixed; right: 24px; bottom: 10px;
      font-size: 11px; color: var(--muted);
      opacity: 0.9; pointer-events: none; z-index: 20;
    }

    .top-action-bar { display: flex; align-items: center; justify-content: space-between; padding: 32px 40px 16px 40px; border-bottom: 1px solid transparent; flex-shrink: 0; }
    .quick-add-row { flex: 1; max-width: 600px; display: flex; align-items: center; }
    .quick-add-row input {
      flex: 1; background: transparent; border: none; border-bottom: 1px solid var(--border);
      padding: 8px 4px; font-size: 14px; color: var(--text-main); outline: none;
    }
    .quick-add-row input::placeholder { color: var(--muted); }
    .quick-add-row input:focus { border-bottom-color: var(--sidebar-text); }
    
    .top-controls { display: flex; gap: 16px; margin-left: 32px; position: relative; }
    .icon-btn { color: var(--muted); padding: 4px; transition: color 0.2s; }
    .icon-btn:hover { color: var(--sidebar-text); }
    .icon-btn svg { width: 20px; height: 20px; stroke-width: 1.5; }

    .canvas-scroll { flex: 1; overflow-x: auto; overflow-y: hidden; padding: 16px 40px 40px 40px; }
    .kanban-board { display: flex; flex-direction: column; flex-wrap: wrap; align-content: flex-start; gap: 16px; height: 100%; }
    .kanban-column { width: 380px; max-height: 100%; padding: 16px; border-radius: var(--radius); display: flex; flex-direction: column; transition: all 0.2s; }
    
    .kanban-header { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 12px; flex-shrink: 0; min-height: 28px; }
    .kanban-header h3 { font-size: 18px; display: flex; align-items: baseline; gap: 8px; width: 100%; }
    
    .header-controls { display: flex; gap: 4px; align-items: center; }
    .pin-btn, .collapse-btn, .shift-btn { font-size: 14px; opacity: 0.3; transition: opacity 0.2s; padding: 2px 4px; font-weight:bold; }
    .pin-btn:hover, .collapse-btn:hover, .shift-btn:hover, .pin-btn.is-pinned { opacity: 1; }

    .kanban-counter { font-size: 14px; opacity: 0.6; font-family: var(--font-sans); margin-left: 4px; display: none; }
    .kanban-column.collapsed .kanban-counter { display: inline; }

    .kanban-tasks-list { flex: 1; overflow-y: auto; overflow-x: hidden; padding-right: 4px; }
    
    /* Invisible hover-only scrollbars */
    .sidebar-scroll::-webkit-scrollbar,
    .kanban-tasks-list::-webkit-scrollbar,
    .canvas-scroll::-webkit-scrollbar {
      width: 6px; height: 6px;
    }
    .sidebar-scroll::-webkit-scrollbar-thumb,
    .kanban-tasks-list::-webkit-scrollbar-thumb,
    .canvas-scroll::-webkit-scrollbar-thumb {
      background: transparent; border-radius: 4px; transition: background 0.2s;
    }
    .sidebar-scroll:hover::-webkit-scrollbar-thumb,
    .kanban-tasks-list:hover::-webkit-scrollbar-thumb,
    .canvas-scroll:hover::-webkit-scrollbar-thumb {
      background: rgba(0,0,0,0.15);
    }
    body.dark-mode .sidebar-scroll:hover::-webkit-scrollbar-thumb,
    body.dark-mode .kanban-tasks-list:hover::-webkit-scrollbar-thumb,
    body.dark-mode .canvas-scroll:hover::-webkit-scrollbar-thumb {
      background: rgba(255,255,255,0.15);
    }

    .kanban-column.collapsed .kanban-tasks-list { display: none; }
    .kanban-column.collapsed { padding-bottom: 12px; }
    .kanban-column.collapsed .kanban-header { margin-bottom: 0; }

    .kanban-task {
      display: flex; align-items: flex-start; gap: 8px;
      padding: 8px 0; border-bottom: 1px solid transparent;
      cursor: pointer; transition: background 0.2s;
    }
    .kanban-task:hover { border-bottom-color: rgba(0,0,0,0.05); background: rgba(255,255,255,0.2); }
    body.dark-mode .kanban-task:hover { background: rgba(0,0,0,0.1); border-bottom-color: rgba(255,255,255,0.05); }
    
    .kanban-task input { margin-top: 1px; width: 12px; height: 12px; cursor: pointer; }
    .kanban-task-main { flex: 1; }
    .kanban-task-title { font-size: 14px; font-weight: bold; margin-bottom: 4px; line-height: 1.3;}
    .kanban-task.completed .kanban-task-title { opacity: 0.5; text-decoration: line-through; }
    .kanban-task-meta { font-size: 11px; font-style: italic; opacity: 0.8; display: inline-block; margin-left: 6px; letter-spacing: 0.2px;}

    .popover {
      display: none; position: absolute; top: 100%; right: 0; margin-top: 12px;
      background: var(--canvas-bg); border: 1px solid var(--border);
      border-radius: var(--radius); box-shadow: 0 8px 24px rgba(0,0,0,0.1);
      z-index: 100; padding: 16px;
    }
    .popover.active { display: block; }
    .theme-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; }
    .color-swatch { width: 24px; height: 24px; border-radius: var(--radius); cursor: pointer; }
    .menu-list { width: 160px; padding: 4px; }
    .menu-list button { display: block; width: 100%; text-align: left; padding: 8px 10px; color: var(--text-main); font-size: 13px; }
    .menu-list button:hover { background: rgba(0,0,0,0.05); font-weight: bold;}

    dialog {
      width: min(600px, calc(100% - 32px)); 
      background: var(--sidebar-bg); color: var(--sidebar-text);
      border: 1px solid var(--border); border-radius: var(--radius); 
      padding: 0; box-shadow: 0 16px 50px rgba(0,0,0,0.15);
    }
    dialog::backdrop { background: rgba(0,0,0,.3); }
    .dialog-content { padding: 32px; }

    .modal-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); padding-bottom: 12px; margin-bottom: 16px; }
    .modal-header h2 { font-size: 22px; }
    
    .mark-done-btn { background: transparent; border: 1px solid var(--border); border-radius: 4px; padding: 6px 12px; font-size: 13px; font-weight: bold; cursor: pointer; color: var(--sidebar-text); opacity: 0.8; transition: 0.2s;}
    .mark-done-btn:hover { opacity: 1; background: rgba(0,0,0,0.05); }

    .action-btn { font-size: 13px; font-weight: bold; color: var(--sidebar-text); opacity: 0.8; }
    .action-btn:hover { opacity: 1; text-decoration: underline; }

    .click-to-edit {
      width: 100%; background: transparent; border: 1px solid transparent;
      color: var(--sidebar-text); font-size: 14px; padding: 6px 0; transition: all 0.2s; outline: none; resize: none;
    }
    .click-to-edit.title { font-size: 18px; font-weight: bold; }
    
    .view-mode .edit-only { display: none !important; }
    .view-mode .click-to-edit { cursor: text; opacity: 0.9; }
    .view-mode .editable-label button { display: none; }
    
    .edit-mode .view-only { display: none !important; }
    .edit-mode .click-to-edit { border-bottom: 1px dashed rgba(0,0,0,0.2); }
    .edit-mode .click-to-edit:hover { border-bottom-color: rgba(0,0,0,0.4); cursor: text; }
    .edit-mode .click-to-edit:focus { border-bottom-style: solid; border-bottom-color: var(--sidebar-text); }
    body.dark-mode .edit-mode .click-to-edit { border-bottom-color: rgba(255,255,255,0.2); }
    body.dark-mode .edit-mode .click-to-edit:focus { border-bottom-color: var(--sidebar-text); }
    
    .modal-label { font-size: 11px; font-weight: bold; text-transform: uppercase; opacity: 0.6; display: block; letter-spacing: 0.5px; margin-bottom: 4px; }
    .label-input-wrap { display: flex; gap: 10px; }
    
    .dialog-actions { display: flex; justify-content: space-between; margin-top: 32px; }
    .dialog-actions button { padding: 8px 16px; border-radius: var(--radius); font-size: 13px; font-weight: bold; border: 1px solid var(--border); background: transparent; color: var(--sidebar-text); cursor: pointer;}
    .dialog-actions .primary { background: var(--sidebar-text); color: var(--sidebar-bg); border: none; }

    .rel-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--border); }
    .rel-list { font-size: 13px; opacity: 0.8; line-height: 1.6; display: flex; flex-direction: column; gap: 4px; }

    .label-suggestions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
    .label-suggestion { padding: 4px 10px; border-radius: var(--radius); font-size: 13px; cursor:pointer; background: var(--canvas-bg); border: 1px solid var(--border); color: var(--sidebar-text); }
    .label-suggestion:hover { font-weight:bold; }
    
    .editable-label { display: inline-flex; align-items: center; gap: 6px; padding: 2px 0; font-size: 13px; }
    .editable-label button { opacity: 0.6; color: var(--danger); font-size: 14px;}
    .editable-label button:hover { opacity: 1; }

    #statusToast {
      position: fixed; bottom: 24px; right: 24px; background: var(--sidebar-text); color: var(--sidebar-bg);
      padding: 12px 24px; border-radius: 4px; font-size: 13px; font-weight:bold;
      transition: opacity 0.3s, transform 0.3s; opacity: 0; transform: translateY(10px); pointer-events: none; z-index: 1000;
    }
    #statusToast.show { opacity: 1; transform: translateY(0); pointer-events: auto; }
  </style>
</head>
<body>
  
  <aside class="sidebar">
    <button type="button" id="sidebarReopenBtn" class="sidebar-reopen" title="Expand Sidebar" aria-label="Expand Sidebar">›</button>
    <div class="sidebar-fixed">
      
      <div class="header-row">
        <h1>Offline To-Do</h1>
        <button type="button" id="sidebarCollapseBtn" class="sidebar-collapse-btn" title="Collapse Sidebar" aria-label="Collapse Sidebar">‹</button>
      </div>
      
      <div class="filter-group">
        <span class="filter-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg></span>
        <select id="visibilityFilter">
          <option value="open">Visibility: Open</option>
          <option value="all">Visibility: All</option>
          <option value="completed">Visibility: Done</option>
        </select>
      </div>
      <div class="filter-group">
        <span class="filter-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"></path><line x1="7" y1="7" x2="7.01" y2="7"></line></svg></span>
        <select id="labelFilter"><option value="">Labels: All</option></select>
      </div>
      <div class="filter-group">
        <span class="filter-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"></path><line x1="4" y1="22" x2="4" y2="15"></line></svg></span>
        <select id="priorityFilter">
          <option value="">Priority: All</option>
          <option value="high">Priority: High</option>
          <option value="mid">Priority: Mid</option>
          <option value="low">Priority: Low</option>
          <option value="none">Priority: None</option>
        </select>
      </div>
      <div class="filter-group">
        <span class="filter-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"></line><polyline points="19 12 12 19 5 12"></polyline></svg></span>
        <select id="sortSelect">
          <option value="due-asc">Sort: Due date ↑</option>
          <option value="due-desc">Sort: Due date ↓</option>
          <option value="priority-desc">Sort: Priority ↓</option>
          <option value="priority-asc">Sort: Priority ↑</option>
          <option value="label-asc">Sort: Label A → Z</option>
        </select>
      </div>
      
      <div class="quick-add-row" style="margin-top: 24px;">
        <span class="filter-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg></span>
        <input id="searchInput" type="text" placeholder="Search Task..." autocomplete="off">
      </div>

      <div class="view-toggle">
        <button class="view-button active" data-view="list">LIST</button> / 
        <button class="view-button" data-view="due">DUE</button>
      </div>
    </div>

    <div class="sidebar-scroll" id="content-a"></div>
  </aside>

  <main class="canvas">
    <header class="top-action-bar">
      <div class="quick-add-row">
        <input id="quickAddInput" type="text" placeholder="+ Add Task (Type & Press Enter)" autocomplete="off">
      </div>
      
      <div class="top-controls">
        <button id="themeToggleBtn" class="icon-btn" title="Themes">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22C6.477 22 2 17.523 2 12S6.477 2 12 2s10 4.477 10 10c0 2.21-.895 4-2 4h-1.5c-1.105 0-2 .895-2 2v1c0 1.657-1.343 3-3 3h-1.5z"></path></svg>
        </button>
        <div id="themePopover" class="popover"><div id="themeGrid" class="theme-grid"></div></div>

        <button id="darkModeBtn" class="icon-btn" title="Toggle Dark Mode">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
        </button>

        <button id="settingsMenuBtn" class="icon-btn" title="Settings / More">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="1.5"></circle><circle cx="19" cy="12" r="1.5"></circle><circle cx="5" cy="12" r="1.5"></circle></svg>
        </button>
        <div id="settingsPopover" class="popover menu-list">
          <button id="exportBtn">Export JSON</button>
          <button id="importBtn">Import JSON</button>
          <button id="clearCompletedBtn" style="color: var(--danger)">Clear Completed</button>
        </div>
      </div>
    </header>

    <div class="canvas-scroll">
      <div id="kanban-board" class="kanban-board"></div>
    </div>
  </main>

  <dialog id="taskDialog">
    <div class="dialog-content">
      <div class="modal-header">
        <h2 id="dialogTitle">Task Details</h2>
        <div style="display:flex; gap:12px; align-items:center;">
          <button type="button" id="toggleEditBtn" class="action-btn view-only">✎ Edit</button>
          <button type="button" id="markDoneBtn" class="mark-done-btn">○ Mark as Done</button>
        </div>
      </div>
      
      <form id="taskForm">
        <input type="checkbox" id="taskCompletedInput" style="display:none;">
        
        <input id="taskTitleInput" class="click-to-edit title" type="text" placeholder="Task Title" required maxlength="200">
        
        <div style="display: flex; gap: 20px; margin-top: 16px;">
          <div style="flex:1;">
            <span class="modal-label">Due Date</span>
            <input id="taskDueInput" type="date" class="click-to-edit">
          </div>
          <div style="flex:1;">
            <span class="modal-label">Priority</span>
            <select id="taskPriorityInput" class="click-to-edit">
              <option value="">None</option>
              <option value="high">High</option>
              <option value="mid">Mid</option>
              <option value="low">Low</option>
            </select>
          </div>
        </div>
        
        <div style="margin-top: 16px;">
          <span class="modal-label">Notes</span>
          <textarea id="taskNotesInput" class="click-to-edit edit-only" maxlength="3000" placeholder="Add notes..." style="min-height: 80px;"></textarea>
          <div id="taskNotesDisplay" class="click-to-edit view-only" style="white-space: pre-wrap; line-height: 1.5; min-height: 28px;"></div>
        </div>
        
        <div style="margin-top: 16px;" class="edit-only">
          <span class="modal-label">Labels</span>
          <div class="label-input-wrap">
            <input id="taskLabelInput" class="click-to-edit" type="text" autocomplete="off" placeholder="Type and press Enter...">
          </div>
          <div id="labelSuggestions" class="label-suggestions"></div>
        </div>
        
        <div style="margin-top: 16px;" class="view-only">
          <span class="modal-label">Labels</span>
        </div>
        <div id="taskLabelEditor" class="label-suggestions" style="margin-top:0;"></div>
        
        <div class="rel-grid">
          <div>
            <span class="modal-label" style="color:var(--danger);">Blocked By (Subtasks)</span>
            <div class="edit-only">
                <input id="dependencyInput" class="click-to-edit" type="text" autocomplete="off" placeholder="+ Search or create new..." style="font-size:12px; padding:4px 0;">
                <div id="dependencySuggestions" class="label-suggestions"></div>
            </div>
            <div id="dependencyEditor" class="rel-list" style="margin-top:8px;"></div>
          </div>
          <div>
            <span class="modal-label">Blocking (Dependents)</span>
            <div id="blockingEditor" class="rel-list" style="margin-top:8px;"></div>
          </div>
        </div>
        
        <div class="dialog-actions edit-only">
          <div><button type="button" id="deleteTaskBtn" style="color:var(--danger); border:none; padding-left:0;">Delete Task</button></div>
          <div style="display:flex; gap:12px;">
            <button type="button" id="cancelTaskBtn">Cancel</button>
            <button type="submit" class="primary" id="saveTaskBtn">Save</button>
          </div>
        </div>
      </form>
    </div>
  </dialog>

  <input id="importFileInput" type="file" accept=".json,application/json" hidden>
  <div id="statusToast"></div>
  <div id="lastBackupNotice" class="last-backup-notice"></div>

  <script>
    (function () {
      "use strict";

      const STORAGE_KEY = "offline-todo.tasks.v3";
      const LAST_BACKUP_KEY = "offline-todo.lastBackup";
      const SIDEBAR_COLLAPSED_KEY = "offline-todo.sidebarCollapsed";
      const LEGACY_V2_KEY = "offline-todo.tasks.v2";
      const LEGACY_V1_KEY = "offline-todo.tasks.v1";
      const THEME_KEY = "offline-todo.theme.v2";
      const DARK_KEY = "offline-todo.dark";
      const PINNED_LABELS_KEY = "offline-todo.pinned";
      const COLLAPSED_LABELS_KEY = "offline-todo.collapsed";
      const LABEL_ORDER_KEY = "offline-todo.labelOrder";
      const COMPLETED_LABEL = "Completed";
      const PRIORITY_ORDER = { low: 1, mid: 2, high: 3 };

      const svgs = {
        view: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>`,
        edit: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>`,
        duplicate: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>`,
        delete: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>`
      };

      let tasks = [];
      let pinnedLabels = [];
      let collapsedBlocks = [];
      let currentLeftView = "list";
      let editingTaskId = null;
      let draftLabels = [];
      let draftDependsOn = [];
      let currentTheme = { h: 217, s: 20 };
      let isEditMode = false;

      const els = {
        contentA: document.getElementById("content-a"),
        kanbanBoard: document.getElementById("kanban-board"),
        quickAdd: document.getElementById("quickAddInput"),
        search: document.getElementById("searchInput"),
        filters: {
          vis: document.getElementById("visibilityFilter"),
          lbl: document.getElementById("labelFilter"),
          pri: document.getElementById("priorityFilter"),
          srt: document.getElementById("sortSelect")
        },
        dialog: document.getElementById("taskDialog"),
        form: document.getElementById("taskForm"),
        inputs: {
          title: document.getElementById("taskTitleInput"),
          due: document.getElementById("taskDueInput"),
          pri: document.getElementById("taskPriorityInput"),
          notes: document.getElementById("taskNotesInput"),
          notesDisplay: document.getElementById("taskNotesDisplay"),
          lbl: document.getElementById("taskLabelInput"),
          dep: document.getElementById("dependencyInput"),
          comp: document.getElementById("taskCompletedInput")
        }
      };

      const storageGet = (k) => { try { return window.localStorage.getItem(k); } catch(e) { return null; } };
      const storageSet = (k, v) => { try { window.localStorage.setItem(k, v); } catch(e) {} };
      const makeId = () => "task-" + Date.now() + "-" + Math.random().toString(16).slice(2);

      function formatBackupDate(iso) {
        if (!iso) return "Never";
        const d = new Date(iso);
        if (Number.isNaN(d.getTime())) return "Never";
        return new Intl.DateTimeFormat('en-US', {
          year: 'numeric', month: 'short', day: 'numeric',
          hour: 'numeric', minute: '2-digit'
        }).format(d);
      }

      function renderLastBackupNotice() {
        const el = document.getElementById("lastBackupNotice");
        if (el) el.textContent = "Last backup: " + formatBackupDate(storageGet(LAST_BACKUP_KEY));
      }

      function setSidebarCollapsed(collapsed) {
        document.body.classList.toggle("body-sidebar-collapsed", collapsed);
        storageSet(SIDEBAR_COLLAPSED_KEY, collapsed ? "true" : "false");
      }
      const escapeHtml = (val) => String(val).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
      const parseDateOnly = (val) => /^\d{4}-\d{2}-\d{2}$/.test(val) ? new Date(...val.split("-").map((v, i) => i === 1 ? v - 1 : Number(v))) : null;
      
      const getLocalTodayDateString = () => {
        const d = new Date();
        return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, '0') + "-" + String(d.getDate()).padStart(2, '0');
      };

      const linkify = (text) => {
        const safeText = escapeHtml(text);
        return safeText.replace(/(https?:\/\/[^\s]+)/g, (url) => `<a href="${url}" target="_blank" rel="noopener noreferrer" style="color:var(--sidebar-text); font-weight:bold; text-decoration:underline;">${url}</a>`);
      };

      function showToast(msg, undoCallback) {
        const toast = document.getElementById("statusToast");
        let html = `<span>${escapeHtml(msg)}</span>`;
        if (undoCallback) html += `<button id="undoToastBtn" style="margin-left:16px; background:transparent; border:1px solid rgba(255,255,255,0.3); color:inherit; border-radius:4px; padding:4px 10px; cursor:pointer;">Undo</button>`;
        toast.innerHTML = html;
        if (undoCallback) document.getElementById("undoToastBtn").onclick = () => { undoCallback(); toast.classList.remove("show"); };
        toast.classList.add("show");
        clearTimeout(toast._timer);
        toast._timer = setTimeout(() => toast.classList.remove("show"), 4000);
      }

      function applyTheme() {
        const root = document.documentElement.style;
        const h = currentTheme.h, s = currentTheme.s, isDark = document.body.classList.contains("dark-mode");
        if (isDark) {
          root.setProperty('--sidebar-bg', `hsl(${h}, 15%, 15%)`);
          root.setProperty('--sidebar-text', `hsl(${h}, 20%, 85%)`);
          root.setProperty('--border', 'rgba(255,255,255,0.1)');
          root.setProperty('--canvas-bg', `hsl(${h}, 10%, 10%)`);
          root.setProperty('--text-main', '#e2e8f0');
          root.setProperty('--muted', '#718096');
        } else {
          root.setProperty('--sidebar-bg', `hsl(${h}, ${s}%, 90%)`);
          root.setProperty('--sidebar-text', `hsl(${h}, ${s}%, 15%)`);
          root.setProperty('--border', 'rgba(0,0,0,0.08)');
          root.setProperty('--canvas-bg', `hsl(${h}, ${Math.max(0, s-10)}%, 98%)`);
          root.setProperty('--text-main', '#1a202c');
          root.setProperty('--muted', '#a0aec0');
        }
      }

      function initThemes() {
        const grid = document.getElementById("themeGrid");
        [0, 200, 217, 120, 40, 280, 340].forEach(hue => {
          let btn = document.createElement("div"); btn.className = "color-swatch"; btn.style.background = `hsl(${hue}, 20%, 60%)`;
          btn.onclick = () => { currentTheme = {h: hue, s: 20}; storageSet(THEME_KEY, JSON.stringify(currentTheme)); applyTheme(); render(); };
          grid.appendChild(btn);
        });
        const saved = storageGet(THEME_KEY); if (saved) { try { currentTheme = JSON.parse(saved); } catch(e){} }
        if (storageGet(DARK_KEY) === "true") document.body.classList.add("dark-mode");
        applyTheme();
      }

      document.getElementById("darkModeBtn").addEventListener("click", () => {
        document.body.classList.toggle("dark-mode");
        storageSet(DARK_KEY, document.body.classList.contains("dark-mode"));
        applyTheme(); render();
      });

      const getTaskById = (id) => tasks.find(t => t.id === id) || null;
      const saveTasks = () => storageSet(STORAGE_KEY, JSON.stringify(tasks));
      
      const getAllLabels = () => {
        const map = {};
        tasks.forEach(t => t.labels.forEach(l => {
          if (!map[l.toLowerCase()]) map[l.toLowerCase()] = l;
        }));
        return Object.values(map).sort((a, b) => a.localeCompare(b));
      };
      
      const isBlockingOthers = (id) => tasks.some(t => !t.completed && t.dependsOn.includes(id));
      const unfinishedDependencies = (t) => t.dependsOn.map(getTaskById).filter(dep => dep && !dep.completed);
      const taskCanBeCompleted = (t) => unfinishedDependencies(t).length === 0;
      
      const wouldCreateDependencyCycle = (taskId, depId) => {
        if (!taskId || !depId) return false;
        if (taskId === depId) return true;
        let visited = {}, stack = [depId];
        while (stack.length) {
          let current = stack.pop();
          if (current === taskId) return true;
          if (visited[current]) continue;
          visited[current] = true;
          const t = getTaskById(current);
          if (t) t.dependsOn.forEach(next => { if (!visited[next]) stack.push(next); });
        }
        return false;
      };

      function toggleTaskCompletion(taskId, checkbox) {
        const t = getTaskById(taskId);
        if (!t) return;
        if (checkbox.checked && !taskCanBeCompleted(t)) {
          const deps = unfinishedDependencies(t).map(d => `• ${d.title}`).join('\n');
          window.alert(`Cannot complete "${t.title}" yet.\n\nUnfinished dependencies:\n${deps}`);
          checkbox.checked = false; return;
        }
        t.completed = checkbox.checked;
        t.labels = t.labels.filter(l => l.toLowerCase() !== COMPLETED_LABEL.toLowerCase());
        if (t.completed) t.labels.push(COMPLETED_LABEL);
        t.labels = [...new Set(t.labels)];
        saveTasks(); render();
      }

      function loadTasks() {
        let raw = storageGet(STORAGE_KEY) || storageGet(LEGACY_V2_KEY) || storageGet(LEGACY_V1_KEY);
        try {
          let parsed = JSON.parse(raw); if (!Array.isArray(parsed)) return [];
          return parsed.filter(t => t && t.id && t.title).map(t => {
            let norm = {
              id: t.id, title: t.title, notes: t.notes || "", dueDate: t.dueDate || "", priority: ['low','mid','high'].includes(t.priority)?t.priority:"",
              completed: !!t.completed, pinned: !!t.pinned, labels: [...new Set(t.labels || [])],
              dependsOn: [...new Set(t.dependsOn || [])].filter(id => id !== t.id), createdAt: t.createdAt || Date.now()
            };
            norm.labels = norm.labels.filter(l => l.toLowerCase() !== COMPLETED_LABEL.toLowerCase());
            if (norm.completed) norm.labels.push(COMPLETED_LABEL);
            return norm;
          });
        } catch(e) { return []; }
      }

      function deleteTaskById(id) {
        const t = getTaskById(id); if (!t || !window.confirm(`Delete "${t.title}"?`)) return;
        const parents = tasks.filter(p => p.dependsOn.includes(id)).map(p => p.id);
        const undo = { task: t, parents };
        tasks = tasks.filter(item => item.id !== id);
        tasks.forEach(item => item.dependsOn = item.dependsOn.filter(d => d !== id));
        saveTasks(); render(); if (editingTaskId === id) els.dialog.close();
        showToast("Task deleted.", () => {
          tasks.push(undo.task);
          undo.parents.forEach(pId => { const pt = getTaskById(pId); if (pt && !pt.dependsOn.includes(undo.task.id)) pt.dependsOn.push(undo.task.id); });
          saveTasks(); render(); showToast("Task restored");
        });
      }

      const getPastelColors = (label) => {
        const isDark = document.body.classList.contains("dark-mode"), str = label.toLowerCase();
        let h = str === 'blockers' ? 10 : str === 'completed' ? 140 : 
                [45, 190, 260, 320, 210, 280][Math.abs(str.split('').reduce((a, b) => a + ((a << 5) - a) + b.charCodeAt(0), 0)) % 6];
        return isDark ? { bg: 'rgba(255,255,255,0.04)', text: `hsl(${h}, 70%, 80%)` } 
                      : { bg: `hsl(${h}, 80%, 90%)`, text: `hsl(${h}, 80%, 25%)` };
      };

      const formatMetaHtml = (t) => {
        let parts = t.labels.filter(l => l.toLowerCase() !== COMPLETED_LABEL.toLowerCase())
          .map(l => `<span style="color:${getPastelColors(l).text}; font-weight:bold;">(${escapeHtml(l)})</span>`);
        if (t.dueDate) parts.push(`<span style="opacity:0.7">(${new Intl.DateTimeFormat('en-US', { month: 'short', day: 'numeric' }).format(new Date(t.dueDate + "T00:00:00"))})</span>`);
        if (t.priority) parts.push(`<span style="opacity:0.7">(${t.priority.charAt(0).toUpperCase() + t.priority.slice(1)})</span>`);
        return parts.join(" ");
      };

      const renderSidebarCard = (t) => {
        const meta = formatMetaHtml(t);
        return `
          <div class="task-card ${t.completed ? 'completed' : ''}" data-task-id="${t.id}">
            
            <div class="task-actions">
              <button type="button" class="action-icon" data-action="view" title="View">${svgs.view}</button>
              <button type="button" class="action-icon" data-action="edit" title="Edit">${svgs.edit}</button>
              <button type="button" class="action-icon" data-action="duplicate" title="Duplicate">${svgs.duplicate}</button>
              <button type="button" class="action-icon delete-icon" data-action="delete" title="Delete">${svgs.delete}</button>
            </div>

            <div class="task-main-row">
              <input type="checkbox" class="task-check" data-action="toggle" ${t.completed ? 'checked' : ''}>
              <div class="task-title" data-action="view">${escapeHtml(t.title)}</div>
            </div>

            ${meta ? `<div class="task-meta-line">${meta}</div>` : ''}

          </div>`;
      };

      const renderKanbanTask = (t, colors) => {
        let metaParts = [];
        if (t.dueDate) metaParts.push(`(${new Intl.DateTimeFormat('en-US', { month: 'short', day: 'numeric' }).format(new Date(t.dueDate + "T00:00:00"))})`);
        if (t.priority) metaParts.push(`(${t.priority.charAt(0).toUpperCase() + t.priority.slice(1)})`);
        return `
          <div class="kanban-task ${t.completed ? 'completed' : ''}" data-task-id="${t.id}">
            <input type="checkbox" data-action="toggle" ${t.completed ? 'checked' : ''}>
            <div class="kanban-task-main" data-action="view">
              <div class="kanban-task-title">${escapeHtml(t.title)}
                ${metaParts.length ? `<span class="kanban-task-meta" style="color:${colors.text}">${escapeHtml(metaParts.join(" "))}</span>` : ''}
              </div>
            </div>
          </div>`;
      };

      function render() {
        const query = els.search.value.trim().toLowerCase();
        const vis = els.filters.vis.value, lbl = els.filters.lbl.value, pri = els.filters.pri.value, srt = els.filters.srt.value;

        let visible = tasks.filter(t => 
          (!query || t.title.toLowerCase().includes(query) || t.notes.toLowerCase().includes(query) || t.labels.some(l => l.toLowerCase().includes(query))) &&
          (vis === "all" || (vis === "open" && !t.completed) || (vis === "completed" && t.completed)) &&
          (!lbl || t.labels.some(l => l.toLowerCase() === lbl.toLowerCase())) &&
          (!pri || (pri === "none" && !t.priority) || t.priority === pri)
        ).sort((a, b) => {
          if (a.pinned !== b.pinned) return a.pinned ? -1 : 1;
          if (srt === "due-asc") return (a.dueDate || "9999-12-31").localeCompare(b.dueDate || "9999-12-31");
          if (srt === "due-desc") return (b.dueDate || "9999-12-31").localeCompare(a.dueDate || "9999-12-31");
          if (srt === "priority-desc") return (PRIORITY_ORDER[b.priority]||0) - (PRIORITY_ORDER[a.priority]||0);
          if (srt === "priority-asc") return (PRIORITY_ORDER[a.priority]||0) - (PRIORITY_ORDER[b.priority]||0);
          if (srt === "label-asc") { const la = a.labels.find(l=>l!==COMPLETED_LABEL)||"", lb = b.labels.find(l=>l!==COMPLETED_LABEL)||""; return la.localeCompare(lb); }
          return a.title.localeCompare(b.title);
        });

        const allLabels = getAllLabels();
        els.filters.lbl.innerHTML = '<option value="">Labels: All</option>' + 
          allLabels.map(l => `<option value="${l}" ${lbl.toLowerCase() === l.toLowerCase() ? 'selected' : ''}>Labels: ${l}</option>`).join('');

        if (currentLeftView === "list") {
          els.contentA.innerHTML = visible.map(renderSidebarCard).join('');
        } else {
          const groups = { "Overdue": [], "Today": [], "Tomorrow": [], "Upcoming": [], "No Date": [] };
          const todayLocal = getLocalTodayDateString();
          visible.forEach(t => {
            if (!t.dueDate) return groups["No Date"].push(t);
            const diff = Math.round((parseDateOnly(t.dueDate) - parseDateOnly(todayLocal)) / 86400000);
            groups[diff < 0 ? "Overdue" : diff === 0 ? "Today" : diff === 1 ? "Tomorrow" : "Upcoming"].push(t);
          });
          
          els.contentA.innerHTML = Object.entries(groups).map(([name, gTasks]) => {
            if (!gTasks.length) return '';
            const color = name === "Overdue" ? "var(--danger)" : name === "Today" ? "var(--success)" : "var(--sidebar-text)";
            const op = ["Overdue", "Today"].includes(name) ? "1" : "0.6";
            return `<h4 style="margin: 24px 0 8px 0; font-weight:normal; border-bottom: 1px solid var(--border); padding-bottom: 4px; color:${color}; opacity:${op}; font-family: var(--font-serif); font-size:16px;">${name}</h4>` 
                   + gTasks.map(renderSidebarCard).join('');
          }).join('');
        }

        let blocksData = { ...allLabels.filter(l => l !== COMPLETED_LABEL).reduce((acc, l) => ({ ...acc, [l]: visible.filter(t => t.labels.includes(l)) }), {}) };
        const blockers = visible.filter(t => !t.completed && isBlockingOthers(t.id));
        if (blockers.length) blocksData['Blockers'] = blockers;

        const savedOrder = JSON.parse(storageGet(LABEL_ORDER_KEY) || '[]');
        const blockNames = Object.keys(blocksData).filter(b => blocksData[b].length > 0).sort((a, b) => {
          if (pinnedLabels.includes(a) !== pinnedLabels.includes(b)) return pinnedLabels.includes(a) ? -1 : 1;
          if (a === 'Blockers') return -1; if (b === 'Blockers') return 1;
          const [idxA, idxB] = [savedOrder.indexOf(a), savedOrder.indexOf(b)];
          return (idxA !== -1 && idxB !== -1) ? idxA - idxB : idxA !== -1 ? -1 : idxB !== -1 ? 1 : a.localeCompare(b);
        });

        els.kanbanBoard.innerHTML = blockNames.map(bName => {
          const isPinned = pinnedLabels.includes(bName), isCollapsed = collapsedBlocks.includes(bName);
          const colors = getPastelColors(bName);
          
          const shiftBtns = bName === 'Blockers' ? '' : `<button class="shift-btn" data-action="shift-up" data-label="${escapeHtml(bName)}" style="color:${colors.text}">↑</button><button class="shift-btn" data-action="shift-down" data-label="${escapeHtml(bName)}" style="color:${colors.text}">↓</button>`;
          
          const editableTitle = bName === 'Blockers' 
            ? `<span>${escapeHtml(bName)}</span>` 
            : `<span data-action="edit-label" data-label="${escapeHtml(bName)}" title="Click to rename" style="cursor:text; border-bottom: 1px dashed transparent;" onmouseenter="this.style.borderBottomColor='currentColor'" onmouseleave="this.style.borderBottomColor='transparent'">${escapeHtml(bName)}</span>`;

          return `
            <div class="kanban-column ${isCollapsed ? 'collapsed' : ''}" style="background-color:${colors.bg}; color:${colors.text}">
              <div class="kanban-header">
                <h3 style="color:${colors.text}">
                  ${editableTitle}
                  <span class="kanban-counter">[${blocksData[bName].filter(t => !t.completed).length} / ${blocksData[bName].length}]</span>
                </h3>
                <div class="header-controls">
                  ${shiftBtns}
                  <button class="collapse-btn" data-action="collapse" data-label="${escapeHtml(bName)}" style="color:${colors.text}">${isCollapsed ? '+' : '−'}</button>
                  <button class="pin-btn ${isPinned ? 'is-pinned' : ''}" data-action="pin" data-label="${escapeHtml(bName)}" style="color:${colors.text}">★</button>
                </div>
              </div>
              <div class="kanban-tasks-list">
                ${blocksData[bName].map(t => renderKanbanTask(t, colors)).join('')}
              </div>
            </div>`;
        }).join('');
      }

      document.addEventListener("click", (e) => {
        const btn = e.target.closest('[data-action]');
        if (!btn) return;
        
        const action = btn.dataset.action;
        const taskId = btn.closest('[data-task-id]')?.dataset.taskId;
        const label = btn.dataset.label;

        if (action === "view" || action === "edit") openEditDialog(taskId, action);
        else if (action === "duplicate") {
          let t = getTaskById(taskId);
          tasks.push({ ...t, id: makeId(), title: t.title + " (Copy)", createdAt: Date.now() });
          saveTasks(); render(); showToast("Task duplicated");
        }
        else if (action === "delete") deleteTaskById(taskId);
        else if (action === "pin") {
          pinnedLabels = pinnedLabels.includes(label) ? pinnedLabels.filter(p => p !== label) : [...pinnedLabels, label];
          storageSet(PINNED_LABELS_KEY, JSON.stringify(pinnedLabels)); render();
        }
        else if (action === "collapse") {
          collapsedBlocks = collapsedBlocks.includes(label) ? collapsedBlocks.filter(c => c !== label) : [...collapsedBlocks, label];
          storageSet(COLLAPSED_LABELS_KEY, JSON.stringify(collapsedBlocks)); render();
        }
        else if (action === "shift-up" || action === "shift-down") {
          let currentOrder = JSON.parse(storageGet(LABEL_ORDER_KEY) || '[]');
          getAllLabels().filter(l => l !== COMPLETED_LABEL).forEach(l => { if (!currentOrder.includes(l)) currentOrder.push(l); });
          let idx = currentOrder.indexOf(label), dir = action === "shift-up" ? -1 : 1;
          if (idx !== -1 && idx + dir >= 0 && idx + dir < currentOrder.length) {
            [currentOrder[idx], currentOrder[idx + dir]] = [currentOrder[idx + dir], currentOrder[idx]];
            storageSet(LABEL_ORDER_KEY, JSON.stringify(currentOrder)); render();
          }
        }
        else if (action === "edit-label") {
          const header = btn.closest('.kanban-header');
          const h3 = header.querySelector('h3');
          h3.innerHTML = `
            <input type="text" id="inlineLabelEdit" value="${escapeHtml(label)}" style="font-size:inherit; font-weight:inherit; font-family:inherit; background:transparent; color:inherit; border:none; border-bottom:1px dashed currentColor; outline:none; width:130px; padding:0;">
            <button data-action="save-label" data-old-label="${escapeHtml(label)}" style="background:transparent; border:none; outline:none; color:inherit; opacity:0.5; padding:2px 6px; border-radius:4px; font-size:16px; cursor:pointer;" onmouseenter="this.style.opacity='1'; this.style.color='var(--success)'; this.style.background='rgba(0,0,0,0.05)'" onmouseleave="this.style.opacity='0.5'; this.style.color='inherit'; this.style.background='transparent'">✓</button>
            <button data-action="cancel-label" style="background:transparent; border:none; outline:none; color:inherit; opacity:0.5; padding:2px 6px; border-radius:4px; font-size:16px; cursor:pointer;" onmouseenter="this.style.opacity='1'; this.style.color='var(--danger)'; this.style.background='rgba(0,0,0,0.05)'" onmouseleave="this.style.opacity='0.5'; this.style.color='inherit'; this.style.background='transparent'">×</button>
          `;
          const input = document.getElementById("inlineLabelEdit");
          input.focus();
          input.select();
          input.addEventListener("keydown", (ev) => {
            if (ev.key === "Enter") { ev.preventDefault(); header.querySelector('[data-action="save-label"]').click(); }
            if (ev.key === "Escape") header.querySelector('[data-action="cancel-label"]').click();
          });
        }
        else if (action === "cancel-label") {
          render();
        }
        else if (action === "save-label") {
          const newLabel = document.getElementById("inlineLabelEdit").value.trim();
          const oldLabel = btn.dataset.oldLabel;
          if (newLabel && newLabel.toLowerCase() !== oldLabel.toLowerCase()) {
            tasks.forEach(t => {
              const idx = t.labels.findIndex(l => l.toLowerCase() === oldLabel.toLowerCase());
              if (idx !== -1) t.labels[idx] = newLabel;
            });
            if (pinnedLabels.includes(oldLabel)) pinnedLabels = [...pinnedLabels.filter(l=>l!==oldLabel), newLabel];
            if (collapsedBlocks.includes(oldLabel)) collapsedBlocks = [...collapsedBlocks.filter(l=>l!==oldLabel), newLabel];
            storageSet(PINNED_LABELS_KEY, JSON.stringify(pinnedLabels));
            storageSet(COLLAPSED_LABELS_KEY, JSON.stringify(collapsedBlocks));
            saveTasks();
          }
          render();
        }
      });

      document.addEventListener("change", (e) => {
        if (e.target.matches('[data-action="toggle"]')) {
          toggleTaskCompletion(e.target.closest('[data-task-id]').dataset.taskId, e.target);
        }
      });

      document.querySelectorAll(".view-button").forEach(btn => {
        btn.addEventListener("click", () => {
          currentLeftView = btn.dataset.view;
          document.querySelectorAll(".view-button").forEach(i => i.classList.toggle("active", i === btn));
          render();
        });
      });
      Object.values(els.filters).forEach(f => f.addEventListener("change", render));
      els.search.addEventListener("input", render);

      const setModalMode = (mode) => {
        isEditMode = (mode === 'edit');
        ['title', 'due', 'notes', 'lbl', 'dep'].forEach(k => els.inputs[k].readOnly = !isEditMode);
        els.inputs.due.disabled = !isEditMode; els.inputs.pri.disabled = !isEditMode;
        els.dialog.classList.toggle('view-mode', !isEditMode); els.dialog.classList.toggle('edit-mode', isEditMode);
      };

      function updateMarkDoneBtn() {
        const btn = document.getElementById("markDoneBtn");
        btn.textContent = els.inputs.comp.checked ? "● Completed" : "○ Mark as Done";
        btn.style.color = els.inputs.comp.checked ? "var(--success)" : "var(--sidebar-text)";
        btn.style.borderColor = els.inputs.comp.checked ? "var(--success)" : "var(--border)";
      }

      document.getElementById("markDoneBtn").onclick = () => {
        els.inputs.comp.checked = !els.inputs.comp.checked;
        updateMarkDoneBtn(); els.inputs.comp.dispatchEvent(new Event('change'));
        if (!isEditMode && editingTaskId) saveDialogTask(new Event('submit', {cancelable: true}));
      };

      const renderDraftLabels = () => {
        const cont = document.getElementById("taskLabelEditor"); cont.innerHTML = "";
        draftLabels.forEach(label => {
          let span = document.createElement("span"); span.className = "editable-label";
          span.innerHTML = `<span>${escapeHtml(label)}</span> <button type='button'>×</button>`;
          span.querySelector("button").onclick = () => { draftLabels = draftLabels.filter(l => l !== label); renderDraftLabels(); renderLabelSuggestions(); };
          cont.appendChild(span);
        });
      };
      
      const renderLabelSuggestions = () => {
        const q = els.inputs.lbl.value.trim().toLowerCase(), cont = document.getElementById("labelSuggestions"); cont.innerHTML = "";
        getAllLabels().filter(l => l.toLowerCase() !== COMPLETED_LABEL.toLowerCase() && !draftLabels.includes(l))
          .filter(l => !q || l.toLowerCase().includes(q)).slice(0,12).forEach(l => {
            let btn = document.createElement("button"); btn.type = "button"; btn.className = "label-suggestion"; btn.textContent = l;
            btn.onclick = () => addDraftLabel(l); cont.appendChild(btn);
          });
      };

      function addDraftLabel(val) {
        let input = (typeof val === "string" ? val : els.inputs.lbl.value).trim();
        if (!input || input.toLowerCase() === COMPLETED_LABEL.toLowerCase()) return;
        let existing = getAllLabels().find(l => l.toLowerCase() === input.toLowerCase()) || input;
        if (!draftLabels.includes(existing)) draftLabels.push(existing);
        els.inputs.lbl.value = ""; renderDraftLabels(); renderLabelSuggestions();
      }

      const renderRelationshipEditors = () => {
        const depEd = document.getElementById("dependencyEditor"), blockEd = document.getElementById("blockingEditor");
        depEd.innerHTML = "";
        draftDependsOn.forEach(id => {
          const t = getTaskById(id);
          let span = document.createElement("span"); span.className = "editable-label"; span.style.cssText = "border:none; padding:2px 0;";
          span.innerHTML = `<span style="cursor:pointer; border-bottom:1px dashed transparent;">• ${escapeHtml(t?t.title:'(missing)')}</span><button type="button" class="edit-only" style="margin-left:8px;">×</button>`;
          span.querySelector("span").onmouseenter = function() { if(!isEditMode) this.style.borderBottomColor = 'var(--sidebar-text)'; };
          span.querySelector("span").onmouseleave = function() { this.style.borderBottomColor = 'transparent'; };
          span.querySelector("span").onclick = () => { if(!isEditMode && t) openEditDialog(id, 'view'); };
          span.querySelector("button").onclick = () => { draftDependsOn = draftDependsOn.filter(v => v !== id); renderRelationshipEditors(); renderDependencySuggestions(); };
          depEd.appendChild(span);
        });

        blockEd.innerHTML = "";
        if (editingTaskId) {
          const dependents = tasks.filter(t => t.dependsOn.includes(editingTaskId));
          if (!dependents.length) blockEd.innerHTML = '<span style="opacity:0.5; font-size:13px;">None</span>';
          else dependents.forEach(dep => {
            let s = document.createElement("span"); s.textContent = "○ " + dep.title;
            s.style.cssText = "display:inline-block; margin-bottom:4px; cursor:pointer; border-bottom:1px dashed transparent;";
            s.onmouseenter = function() { this.style.borderBottomColor = 'var(--sidebar-text)'; };
            s.onmouseleave = function() { this.style.borderBottomColor = 'transparent'; };
            s.onclick = () => openEditDialog(dep.id, 'view');
            blockEd.appendChild(s); blockEd.appendChild(document.createElement("br"));
          });
        } else blockEd.innerHTML = '<span style="opacity:0.5; font-size:13px;">None</span>';
      };

      const renderDependencySuggestions = () => {
        const q = els.inputs.dep.value.trim(), cont = document.getElementById("dependencySuggestions"); cont.innerHTML = "";
        if (q) {
          let btn = document.createElement("button"); btn.type = "button"; btn.className = "label-suggestion";
          btn.innerHTML = `<strong>+ Create new:</strong> "${escapeHtml(q)}"`; btn.style.cssText = "background:var(--sidebar-text); color:var(--sidebar-bg); border:none;";
          btn.onclick = () => {
            let newId = makeId();
            tasks.push({ id: newId, title: q, notes: "", dueDate: "", priority: "", completed: false, labels: [], dependsOn: [], createdAt: Date.now() });
            saveTasks(); draftDependsOn.push(newId); els.inputs.dep.value = ""; renderRelationshipEditors(); renderDependencySuggestions(); render();
          };
          cont.appendChild(btn);
        }
        
        let normalized = q.toLowerCase();
        tasks.filter(t => t.id !== editingTaskId && (!normalized || t.title.toLowerCase().includes(normalized))).slice(0,12)
          .filter(t => !draftDependsOn.includes(t.id) && !wouldCreateDependencyCycle(editingTaskId, t.id))
          .forEach(t => {
            let btn = document.createElement("button"); btn.type = "button"; btn.className = "label-suggestion"; btn.textContent = t.title;
            btn.onclick = () => { draftDependsOn.push(t.id); els.inputs.dep.value = ""; renderRelationshipEditors(); renderDependencySuggestions(); };
            cont.appendChild(btn);
          });
      };

      function saveDialogTask(e) {
        if (e) e.preventDefault();
        const title = els.inputs.title.value.trim(); if (!title) return;
        const labels = [...new Set(draftLabels)].filter(l => l.toLowerCase() !== COMPLETED_LABEL.toLowerCase());
        
        if (editingTaskId && draftDependsOn.some(depId => wouldCreateDependencyCycle(editingTaskId, depId))) {
            window.alert("One of those dependencies would create a circular dependency."); return;
        }

        let cand = {
          id: editingTaskId || makeId(), title, notes: els.inputs.notes.value.trim(), dueDate: els.inputs.due.value,
          priority: ['low','mid','high'].includes(els.inputs.pri.value)?els.inputs.pri.value:"",
          completed: els.inputs.comp.checked, labels, dependsOn: [...new Set(draftDependsOn)],
          createdAt: editingTaskId ? getTaskById(editingTaskId).createdAt : Date.now()
        };

        if (cand.completed && !taskCanBeCompleted(cand)) {
          const deps = unfinishedDependencies(cand).map(d => `• ${d.title}`).join("\n");
          window.alert(`Cannot complete "${cand.title}" yet.\n\nUnfinished dependencies:\n${deps}`); return;
        }

        if (cand.completed) cand.labels.push(COMPLETED_LABEL);
        cand.labels = [...new Set(cand.labels)];
        
        if (editingTaskId) Object.assign(getTaskById(editingTaskId), cand); else tasks.push(cand);
        saveTasks(); render(); els.dialog.close(); showToast("Task saved");
      }

      function openAddDialog(initialTitle) {
        editingTaskId = null; draftLabels = []; draftDependsOn = [];
        document.getElementById("dialogTitle").textContent = "Add Task";
        els.inputs.title.value = initialTitle || ""; els.inputs.due.value = ""; els.inputs.pri.value = ""; 
        els.inputs.notes.value = ""; els.inputs.notesDisplay.innerHTML = ""; els.inputs.comp.checked = false;
        document.getElementById("deleteTaskBtn").style.visibility = "hidden"; els.inputs.dep.value = ""; els.inputs.lbl.value = "";
        
        setModalMode('edit'); updateMarkDoneBtn(); renderDraftLabels(); renderLabelSuggestions(); renderRelationshipEditors(); renderDependencySuggestions();
        els.dialog.showModal(); els.inputs.title.focus();
      }

      function openEditDialog(id, mode) {
        const t = getTaskById(id); if (!t) return;
        editingTaskId = id; draftLabels = [...t.labels]; draftDependsOn = [...t.dependsOn];
        document.getElementById("dialogTitle").textContent = "Task Details";
        els.inputs.title.value = t.title; els.inputs.due.value = t.dueDate; els.inputs.pri.value = t.priority;
        els.inputs.notes.value = t.notes; els.inputs.notesDisplay.innerHTML = linkify(t.notes); els.inputs.comp.checked = t.completed;
        document.getElementById("deleteTaskBtn").style.visibility = "visible"; els.inputs.dep.value = ""; els.inputs.lbl.value = "";
        
        setModalMode(mode || 'view'); updateMarkDoneBtn(); renderDraftLabels(); renderLabelSuggestions(); renderRelationshipEditors(); renderDependencySuggestions();
        els.dialog.showModal(); if (isEditMode) els.inputs.title.focus();
      }

      els.quickAdd.addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); if (els.quickAdd.value.trim()) { openAddDialog(els.quickAdd.value.trim()); els.quickAdd.value = ""; } } });
      els.form.addEventListener("submit", saveDialogTask);
      document.getElementById("cancelTaskBtn").onclick = () => els.dialog.close();
      document.getElementById("deleteTaskBtn").onclick = () => { if (editingTaskId) deleteTaskById(editingTaskId); };
      document.getElementById('toggleEditBtn').onclick = () => setModalMode('edit');
      els.form.addEventListener('dblclick', () => { if (!isEditMode) setModalMode('edit'); });
      
      els.inputs.lbl.addEventListener("input", renderLabelSuggestions);
      els.inputs.lbl.addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); addDraftLabel(); } });
      els.inputs.dep.addEventListener("input", renderDependencySuggestions);
      els.inputs.dep.addEventListener("keydown", (e) => {
        if (e.key !== "Enter") return; e.preventDefault();
        const q = els.inputs.dep.value.trim().toLowerCase(); if (!q) return;
        const first = tasks.filter(t => t.id !== editingTaskId && t.title.toLowerCase().includes(q))
                           .find(t => !draftDependsOn.includes(t.id) && !wouldCreateDependencyCycle(editingTaskId, t.id));
        if (first) { draftDependsOn.push(first.id); els.inputs.dep.value = ""; renderRelationshipEditors(); renderDependencySuggestions(); }
      });
      els.inputs.comp.addEventListener("change", () => {
        const without = draftLabels.filter(l => l.toLowerCase() !== COMPLETED_LABEL.toLowerCase());
        draftLabels = els.inputs.comp.checked ? [...without, COMPLETED_LABEL] : without;
        renderDraftLabels();
      });

      els.dialog.addEventListener("click", (e) => { if (e.target === els.dialog && !isEditMode) els.dialog.close(); });

      document.getElementById("themeToggleBtn").onclick = (e) => { e.stopPropagation(); document.getElementById("themePopover").classList.toggle("active"); };
      document.getElementById("settingsMenuBtn").onclick = (e) => { e.stopPropagation(); document.getElementById("settingsPopover").classList.toggle("active"); };
      document.addEventListener("click", (e) => { if (!e.target.closest('.popover') && !e.target.closest('.icon-btn')) document.querySelectorAll('.popover').forEach(p => p.classList.remove('active')); });

      document.getElementById("exportBtn").onclick = () => {
        const exportedAt = new Date();
        const stamp = [
          exportedAt.getFullYear(),
          String(exportedAt.getMonth() + 1).padStart(2, '0'),
          String(exportedAt.getDate()).padStart(2, '0'),
          '-',
          String(exportedAt.getHours()).padStart(2, '0'),
          String(exportedAt.getMinutes()).padStart(2, '0'),
          String(exportedAt.getSeconds()).padStart(2, '0')
        ].join('');
        const url = URL.createObjectURL(new Blob([JSON.stringify({ app: "Offline To-Do", version: 3, exportedAt: exportedAt.toISOString(), tasks }, null, 2)], {type: "application/json"}));
        const a = document.createElement("a"); a.href = url; a.download = `offline-todo-backup-${stamp}.json`; document.body.appendChild(a); a.click(); a.remove();
        storageSet(LAST_BACKUP_KEY, exportedAt.toISOString());
        renderLastBackupNotice();
        setTimeout(() => URL.revokeObjectURL(url), 0);
      };
      
      const importInput = document.getElementById("importFileInput");
      document.getElementById("importBtn").onclick = () => importInput.click();
      importInput.addEventListener("change", (e) => {
        const file = e.target.files[0]; if (!file) return;
        const reader = new FileReader();
        reader.onload = (ev) => {
          try {
            let raw = JSON.parse(ev.target.result), incoming = Array.isArray(raw) ? raw : raw.tasks;
            if (!Array.isArray(incoming)) throw new Error("Invalid");
            if (!window.confirm(`Import ${incoming.length} tasks and replace current?`)) return;
            tasks = incoming.filter(t => t && t.id && t.title).map(t => ({...t, labels: t.labels||[], dependsOn: t.dependsOn||[]})); saveTasks(); render(); showToast("Import complete");
          } catch(err) { window.alert("Invalid JSON file."); }
          importInput.value = "";
        };
        reader.readAsText(file);
      });

      document.getElementById("clearCompletedBtn").onclick = () => {
        const c = tasks.filter(t => t.completed).length;
        if (c && window.confirm(`Delete ${c} completed task(s)?`)) { tasks = tasks.filter(t => !t.completed); saveTasks(); render(); showToast("Cleared completed"); }
      };

      document.addEventListener("keydown", (e) => {
        if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's' && els.dialog.open && isEditMode) { e.preventDefault(); document.getElementById('saveTaskBtn').click(); }
        if (e.key === '/' && !['INPUT', 'TEXTAREA'].includes(document.activeElement.tagName)) { e.preventDefault(); els.search.focus(); }
        if (e.key === 'Escape') document.querySelectorAll('.popover').forEach(p => p.classList.remove('active'));
      });

      try { pinnedLabels = JSON.parse(storageGet(PINNED_LABELS_KEY) || '[]'); } catch(e){}
      try { collapsedBlocks = JSON.parse(storageGet(COLLAPSED_LABELS_KEY) || '[]'); } catch(e){}

      document.getElementById("sidebarCollapseBtn").onclick = () => setSidebarCollapsed(true);
      document.getElementById("sidebarReopenBtn").onclick = () => setSidebarCollapsed(false);
      setSidebarCollapsed(storageGet(SIDEBAR_COLLAPSED_KEY) === "true");
      renderLastBackupNotice();

      initThemes();
      tasks = loadTasks();
      if (!storageGet(STORAGE_KEY)) saveTasks();
      render();

    })();
  </script>
</body>
</html>
